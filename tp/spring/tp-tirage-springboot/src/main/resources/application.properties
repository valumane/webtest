spring.application.name=tp-tirage
server.port=8080

# H2 sur disque : les données restent après redémarrage
spring.datasource.url=jdbc:h2:file:./data/demo;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Crée / met à jour les tables depuis les @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console H2 (uniquement pour le développement local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false
